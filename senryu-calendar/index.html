<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シルバー川柳 日めくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e2d3; --paper:#fffdf7; --ink:#2b2622; --red:#c0392b; --sub:#7a6f63;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#2a2724; --paper:#fffdf7; --ink:#2b2622; --red:#c0392b; --sub:#b9ad9f; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:16px;overflow:hidden;user-select:none;
  }
  h1{margin:0;font-size:14px;font-weight:600;color:var(--sub);letter-spacing:.15em;text-align:center}
  .cal{position:relative;width:min(88vw,340px);height:min(120vw,470px);perspective:1200px}
  /* 上の金具 */
  .rings{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:center;gap:90px;z-index:50}
  .rings i{width:16px;height:26px;border-radius:8px;background:#999;box-shadow:inset 0 0 0 3px #666}
  .page{
    position:absolute;inset:0;background:var(--paper);border-radius:6px 6px 10px 10px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    transform-origin:top center;display:flex;flex-direction:column;overflow:hidden;
    cursor:pointer;
  }
  .head{
    background:var(--red);color:#fff;text-align:center;padding:26px 0 8px;
    font-size:14px;letter-spacing:.2em;
  }
  .day{
    text-align:center;font-size:84px;font-weight:700;line-height:1;margin:6px 0 0;color:var(--red);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  }
  .wd{text-align:center;color:var(--sub);font-size:14px;margin-bottom:6px;letter-spacing:.2em}
  .poem{
    flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:4px 12px 10px;
  }
  .poem p{
    writing-mode:vertical-rl;margin:0;font-size:clamp(19px,5.6vw,25px);line-height:1.9;
    color:var(--ink);white-space:nowrap;text-orientation:upright;
  }
  .poem span{display:block;margin-left:.5em}
  /* 1行目を右に、2行目を少し下げて川柳らしく */
  .poem span:nth-child(2){margin-top:1em}
  .poem span:nth-child(3){margin-top:2em}
  .foot{
    font-size:11px;color:var(--sub);text-align:center;padding:6px 0 10px;border-top:1px dashed #d6cdbb;
  }
  .tear{animation:tear .85s cubic-bezier(.5,.1,.7,.4) forwards;pointer-events:none}
  @keyframes tear{
    0%{transform:rotateX(0) translateY(0);opacity:1}
    35%{transform:rotateX(-35deg) translateY(-6px) rotateZ(-2deg);opacity:1}
    100%{transform:rotateX(-80deg) translate(70px,-420px) rotateZ(18deg);opacity:0}
  }
  .tear-up{animation:tear2 .85s ease-in forwards}
  @keyframes tear2{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translate(-60px,-480px) rotate(-16deg);opacity:0}
  }
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    font:inherit;font-size:14px;padding:10px 16px;border-radius:999px;border:1px solid var(--sub);
    background:var(--paper);color:var(--ink);cursor:pointer;
  }
  button:active{transform:scale(.96)}
  .hint{font-size:12px;color:var(--sub)}
  .end{align-items:center;justify-content:center;text-align:center;gap:14px}
  .end .big{font-size:26px;color:var(--red);line-height:1.6}
</style>
</head>
<body>
<h1>第18回 シルバー川柳 日めくりカレンダー</h1>
<div class="cal" id="cal"><div class="rings"><i></i><i></i></div></div>
<div class="bar">
  <button id="tearBtn">めくる ▶</button>
  <button id="shuffleBtn">ランダム</button>
  <button id="resetBtn">最初から</button>
</div>
<div class="hint">カレンダーをタップしても めくれます</div>

<script>
// 公益社団法人 有料老人ホーム協会「第18回シルバー川柳」入選作品
const POEMS = [
  ["孫達に","アドレス聞かれ","番地言う"],
  ["何回も","話したはずだが","初耳だ"],
  ["紙とペン","探してる間に","句を忘れ"],
  ["三時間","待って病名","加齢です"],
  ["日帰りで","行ってみたいな","天国へ"],
  ["物忘れ","このまま全部","忘れたい"],
  ["どこで見る","東京五輪","天か地か"],
  ["厚化粧","笑う亭主は","薄毛症"],
  ["クラス会","食後は薬の","説明会"],
  ["突然に","医者が優しく","なる不安"],
  ["万歩計","半分以上","探し物"],
  ["改札を","通れずよく見りゃ","診察券"],
  ["年上が","タイプだけれど","もういない"],
  ["恋かなと","思っていたら","不整脈"],
  ["マイナンバー","ナンマイダーと","聴き違え"],
  ["LED","使いきるまで","無い寿命"],
  ["五郎丸","まねて念仏","かと訊かれ"],
  ["いびきより","静かなほうが","気にかかり"],
  ["未練ない","言うが地震で","先に逃げ"],
  ["味のある","字とほめられ","手の震え"]
];
const WD = ["日","月","火","水","木","金","土"];
const cal = document.getElementById("cal");
let order = POEMS.map((_,i)=>i);
let pos = 0;               // いま見えているページ
const start = new Date();  // 今日から1日ずつ進む

function dateOf(n){ const d = new Date(start); d.setDate(d.getDate()+n); return d; }

function makePage(n){
  const el = document.createElement("div");
  if(n >= order.length){
    el.className = "page end";
    el.innerHTML = '<div class="big">おしまい<br>また明日</div><button id="again">もういちど</button>';
    el.querySelector("#again").onclick = e => { e.stopPropagation(); reset(); };
    return el;
  }
  const d = dateOf(n), p = POEMS[order[n]];
  el.className = "page";
  el.innerHTML =
    '<div class="head">'+(d.getFullYear())+'年 '+(d.getMonth()+1)+'月</div>'+
    '<div class="day">'+d.getDate()+'</div>'+
    '<div class="wd">'+WD[d.getDay()]+'曜日</div>'+
    '<div class="poem"><p>'+p.map(s=>'<span>'+s+'</span>').join("")+'</p></div>'+
    '<div class="foot">シルバー川柳 入選作 '+(n+1)+' / '+order.length+'</div>';
  return el;
}

function render(){
  [...cal.querySelectorAll(".page")].forEach(e=>e.remove());
  // 下の紙(次のページ)→上の紙(いまのページ)の順に入れる
  if(pos+1 <= order.length) cal.appendChild(makePage(pos+1)).style.zIndex = 1;
  cal.appendChild(makePage(pos)).style.zIndex = 2;
  cal.querySelectorAll(".page").forEach(p=>p.onclick = tear);
}

let busy = false;
function tear(){
  if(busy || pos >= order.length) return;
  busy = true;
  const top = cal.querySelectorAll(".page")[1] || cal.querySelector(".page");
  top.classList.add("tear");
  if(navigator.vibrate) try{navigator.vibrate(30)}catch(e){}
  setTimeout(()=>{ pos++; busy=false; render(); }, 800);
}
function reset(){ pos = 0; order = POEMS.map((_,i)=>i); render(); }
function shuffle(){
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  pos = 0; render();
}
document.getElementById("tearBtn").onclick = tear;
document.getElementById("resetBtn").onclick = reset;
document.getElementById("shuffleBtn").onclick = shuffle;
render();
</script>
</body>
</html>
