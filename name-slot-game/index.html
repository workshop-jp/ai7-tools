<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スロットあてっこゲーム</title>
<meta name="description" content="ことばあそび用の、スロットマシンみたいに文字がゆっくり回って止まる、カードめくりの当てっこゲームです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF6E7;
  --panel:#FFFFFF;
  --ink:#4A3826;
  --muted:#8A7860;
  --line:#F0DEBE;
  --focus:#2F7DDB;
  --pink:#FF6B81;
  --pink-dark:#E14D63;
  --teal:#3EC6C0;
  --teal-dark:#1FA39D;
  --yellow:#FFC93C;
  --yellow-dark:#E5A800;
  --purple:#9B7EDE;
  --purple-dark:#7C5BC4;
  --blue:#4FADE8;
  --green:#3EC77A;
  --green-dark:#249B57;
  --red:#F0576B;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 18%, #FFE7A6 0 3%, transparent 3.4%),
    radial-gradient(circle at 85% 12%, #B9E9E7 0 3%, transparent 3.4%),
    radial-gradient(circle at 90% 70%, #FFD0DA 0 2.4%, transparent 2.8%),
    radial-gradient(circle at 8% 78%, #D7CCF6 0 2.6%, transparent 3%),
    var(--bg);
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.6;
  font-size:17px;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:580px;margin:0 auto;padding:16px 18px 44px;position:relative}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.icon-btn{width:50px;height:50px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:23px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(74,56,38,.12)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.star-badge{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:700;font-size:19px;box-shadow:0 3px 0 rgba(74,56,38,.12)}

.screen{padding-top:6px}
.logo{font-weight:800;font-size:30px;text-align:center;margin:10px 0 18px;line-height:1.4}
.logo .sub{display:block;font-size:18px;font-weight:700;color:var(--pink-dark);margin-top:2px}

.cat-picker{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.cat-btn{flex:1 1 auto;min-width:100px;min-height:56px;padding:12px 12px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(74,56,38,.1)}
.cat-btn:active{transform:translateY(2px);box-shadow:none}
.cat-btn.active{background:var(--teal);border-color:var(--teal-dark);color:#fff}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 4px 0 rgba(74,56,38,.08)}
.howto h2{margin:0 0 10px;font-size:19px}
.howto ol{margin:0;padding-left:1.3em}
.howto li{margin:9px 0;font-size:17px}

.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:68px;margin-top:20px;
  background:linear-gradient(180deg,#FF8A9B,var(--pink));
  color:#fff;font-weight:800;font-size:21px;border-radius:20px;
  box-shadow:0 5px 0 var(--pink-dark);
}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-dark)}
.cta.big{font-size:24px;min-height:76px}
.cta[disabled]{opacity:.5;pointer-events:none}

.ghost-btn{
  width:100%;min-height:54px;margin-top:12px;background:var(--panel);
  border:2px solid var(--line);border-radius:16px;font-weight:700;font-size:16px;color:var(--muted);
}
.link-btn{display:block;width:100%;text-align:center;margin-top:18px;color:var(--muted);font-size:15.5px;text-decoration:underline;padding:10px}

.hud{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;font-weight:700}
.hud .round{background:var(--purple);color:#fff;border-radius:999px;padding:8px 18px;font-size:16px}
.hud .score{color:var(--yellow-dark);font-size:19px}

.machine{
  background:linear-gradient(180deg,#5B4636,#3E2F24);
  border-radius:24px;padding:26px 16px 32px;position:relative;
  box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.25);
}
.machine-lights{display:flex;justify-content:space-around;margin-bottom:14px;padding:0 4px}
.machine-lights span{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 6px 2px rgba(255,201,60,.7);animation:blink 1s infinite}
.machine-lights span:nth-child(2n){animation-delay:.3s;background:var(--pink)}
.machine-lights span:nth-child(3n){animation-delay:.6s;background:var(--teal)}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.reels{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:16px 12px;background:#2A2019;border-radius:18px;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.reel{
  width:clamp(66px,21vw,100px);height:clamp(82px,25vw,122px);
  background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(38px,11vw,58px);font-weight:800;position:relative;overflow:hidden;
  border-bottom:7px solid var(--line);
}
.reel:nth-child(4n+1){border-bottom-color:var(--pink)}
.reel:nth-child(4n+2){border-bottom-color:var(--teal)}
.reel:nth-child(4n+3){border-bottom-color:var(--yellow)}
.reel:nth-child(4n+4){border-bottom-color:var(--purple)}
.reel .letter{display:block}
.reel.spinning{box-shadow:0 0 0 3px rgba(255,255,255,.25) inset}
.reel.landed{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1.32) rotate(-5deg)}55%{transform:scale(.92) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.reel.tricky{box-shadow:inset 0 0 0 4px var(--yellow-dark),0 0 14px 3px rgba(255,201,60,.65)}
.reel .hint-badge{position:absolute;top:-14px;right:-10px;font-size:20px;animation:badgePulse .6s infinite;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.reel.flip .letter{animation:flipStep .22s ease}
@keyframes flipStep{0%{transform:rotateX(75deg) scale(.85);opacity:.35}100%{transform:rotateX(0deg) scale(1);opacity:1}}
.tricky-banner{
  text-align:center;font-weight:800;font-size:15.5px;color:var(--purple-dark);
  background:#FDF3D8;border:2px dashed var(--yellow-dark);border-radius:16px;
  padding:10px 12px;margin:0 0 12px;
}

.lever-wrap{display:flex;justify-content:center;margin-top:22px}
.lever-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(180deg,#FFD873,var(--yellow));
  color:#5C3A00;font-weight:800;font-size:21px;padding:18px 36px;border-radius:22px;
  box-shadow:0 5px 0 var(--yellow-dark);min-height:76px;min-width:260px;justify-content:center;
}
.lever-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-dark)}
.lever-btn[disabled]{opacity:.45;pointer-events:none}

.prompt-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 14px}
.prompt{text-align:center;font-weight:700;font-size:21px;margin:0;color:var(--purple-dark)}
.icon-btn.small{width:42px;height:42px;font-size:17px;flex:0 0 auto}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choice-card{padding:0;min-height:150px;perspective:900px}
.choice-card .card-inner{
  position:relative;width:100%;height:150px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.choice-card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:20px;backface-visibility:hidden;font-weight:800;text-align:center;
  box-shadow:0 4px 0 rgba(74,56,38,.12);background:var(--panel);border:3px solid var(--line);
  padding:8px;
}
.card-front{font-size:56px}
.card-back{font-size:clamp(18px,6vw,28px);transform:rotateY(180deg);color:var(--ink)}
.choice-card.correct .card-back{background:var(--green);border-color:var(--green-dark);color:#fff}
.choice-card.wrong .card-back{background:#FFE1E5;border-color:var(--red);color:var(--red)}
.choice-card.faded{opacity:.4;pointer-events:none}
.color-swatch{width:60px;height:60px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}

.feedback{text-align:center;font-weight:800;font-size:21px;min-height:32px;margin-top:16px}
.feedback.ok{color:var(--green-dark)}
.feedback.ng{color:var(--pink-dark)}

.settings h2{font-size:21px;margin:6px 0 6px}
.hint{color:var(--muted);font-size:15px;margin:0 0 12px}
textarea#nameInput{
  width:100%;min-height:240px;padding:14px;border-radius:16px;border:2px solid var(--line);
  font-size:17px;font-family:inherit;resize:vertical;background:var(--panel);color:var(--ink);
}
.row{display:flex;gap:10px;margin-top:10px}
.row .cta{margin-top:0}
.row .ghost-btn{margin-top:0}

.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti-piece{position:absolute;top:38%;left:50%;font-size:22px;animation:confetti-fall 1.1s ease-out forwards}
@keyframes confetti-fall{
  0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(var(--dx),260px) rotate(var(--rot)) scale(.7);opacity:0}
}

@media (max-width:360px){
  .logo{font-size:22px}
  .choices{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <button id="btnSound" class="icon-btn" aria-label="おとの オン・オフ" title="おとの オン・オフ">🔊</button>
    <div class="star-badge">⭐ <span id="starTop">0</span></div>
    <button id="btnSettings" class="icon-btn" aria-label="なまえリストの せってい" title="せってい">⚙️</button>
  </header>

  <section id="screen-title" class="screen">
    <h1 class="logo">🎰 スロットあてっこ<span class="sub">ゲーム</span></h1>
    <div id="catPicker" class="cat-picker" role="group" aria-label="あそぶ カテゴリ"></div>
    <div class="panel howto">
      <h2>あそびかた</h2>
      <ol>
        <li>あそびたい カテゴリを えらぼう</li>
        <li>「レバーを ひく」で スロットが ゆっくり まわるよ</li>
        <li>もじが ひとつずつ とまっていくよ</li>
        <li>とまった もじで なにか かんがえて、カードを タップ！ めくれて こたえが わかるよ</li>
      </ol>
    </div>
    <button id="btnStart" class="cta big">🎮 はじめる</button>
    <button id="btnOpenSettingsFromTitle" class="link-btn">📋 リストを へんしゅうする</button>
  </section>

  <section id="screen-game" class="screen" hidden>
    <div class="hud">
      <span class="round" id="roundLabel">1もんめ</span>
      <span class="score">⭐ <span id="starGame">0</span></span>
    </div>

    <p id="trickyBanner" class="tricky-banner" hidden>🔍 にている もじに ちゅうい！さいごまで よくみてね</p>
    <div class="machine">
      <div class="machine-lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="reels" class="reels"></div>
    </div>

    <div class="lever-wrap">
      <button id="btnLever" class="lever-btn">🎰 レバーを ひく！</button>
    </div>

    <div id="promptRow" class="prompt-row" hidden>
      <p id="prompt" class="prompt"></p>
      <button id="btnHearWord" class="icon-btn small" aria-label="もういちど きく" title="もういちど きく">🔊</button>
    </div>
    <div id="choices" class="choices" hidden></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <button id="btnNext" class="cta" hidden>▶ つぎの もんだい</button>
    <button id="btnBackTitle" class="link-btn">🏠 タイトルへ もどる</button>
  </section>

  <section id="screen-settings" class="screen" hidden>
    <h2><span id="settingsCatLabel">どうぶつ</span> リストの へんしゅう</h2>
    <p class="hint">1ぎょうに ひとつずつ、ひらがなで ことばを にゅうりょくしてね（さいてい 4こ ひつよう）。じぶんの クラスや かぞくに あわせて じゆうに かえて あそべるよ。</p>
    <textarea id="nameInput" spellcheck="false"></textarea>
    <div class="row">
      <button id="btnSaveNames" class="cta">💾 ほぞんする</button>
    </div>
    <button id="btnResetNames" class="ghost-btn">はじめの リストに もどす</button>
    <button id="btnCloseSettings" class="link-btn">◀ もどる</button>
  </section>

</div>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  var WORDS_KEY_PREFIX = "nameSlotGame.words.v2.";
  var CATEGORY_KEY = "nameSlotGame.category.v1";
  var MUTE_KEY = "nameSlotGame.muted.v1";
  var CATEGORIES = {
    animal: {
      label: "どうぶつ",
      chip: "🐰 どうぶつ",
      prompt: "どの どうぶつかな？",
      fallbackIcon: "🐾",
      items: [
        {word:"いぬ", icon:"🐶"},
        {word:"ねこ", icon:"🐱"},
        {word:"うさぎ", icon:"🐰"},
        {word:"ぞう", icon:"🐘"},
        {word:"きりん", icon:"🦒"},
        {word:"ぱんだ", icon:"🐼"},
        {word:"くま", icon:"🐻"},
        {word:"らいおん", icon:"🦁"},
        {word:"さる", icon:"🐵"},
        {word:"とら", icon:"🐯"},
        {word:"ひつじ", icon:"🐑"},
        {word:"うま", icon:"🐴"},
        {word:"ぶた", icon:"🐷"},
        {word:"かえる", icon:"🐸"},
        {word:"ぺんぎん", icon:"🐧"},
        {word:"かば", icon:"🦛"}
      ]
    },
    fruit: {
      label: "くだもの",
      chip: "🍎 くだもの",
      prompt: "どの くだものかな？",
      fallbackIcon: "🍽️",
      items: [
        {word:"りんご", icon:"🍎"},
        {word:"ばなな", icon:"🍌"},
        {word:"みかん", icon:"🍊"},
        {word:"いちご", icon:"🍓"},
        {word:"ぶどう", icon:"🍇"},
        {word:"もも", icon:"🍑"},
        {word:"すいか", icon:"🍉"},
        {word:"めろん", icon:"🍈"},
        {word:"なし", icon:"🍐"},
        {word:"さくらんぼ", icon:"🍒"},
        {word:"れもん", icon:"🍋"},
        {word:"くり", icon:"🌰"}
      ]
    },
    color: {
      label: "いろ",
      chip: "🎨 いろ",
      prompt: "どの いろかな？",
      fallbackIcon: "🎨",
      items: [
        {word:"あか", swatch:"#F0576B"},
        {word:"あお", swatch:"#4FADE8"},
        {word:"きいろ", swatch:"#FFC93C"},
        {word:"みどり", swatch:"#3EC77A"},
        {word:"むらさき", swatch:"#9B7EDE"},
        {word:"ぴんく", swatch:"#FF9EC0"},
        {word:"くろ", swatch:"#333333"},
        {word:"しろ", swatch:"#FFFFFF", border:"#D8D0C2"},
        {word:"ちゃいろ", swatch:"#8B5A2B"},
        {word:"みずいろ", swatch:"#A0E6E0"},
        {word:"きんいろ", swatch:"#E6C200"},
        {word:"ぎんいろ", swatch:"#C0C0C0"}
      ]
    }
  };
  var LETTER_POOL = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ".split("");
  var CONFUSABLE_GROUPS = [
    ["る","ろ"],
    ["わ","ね","れ"],
    ["ぬ","め"],
    ["は","ほ"],
    ["さ","ち"],
    ["し","つ"],
    ["い","り"],
    ["く","へ"],
    ["な","た"],
    ["ま","も"],
    ["ん","そ"],
    ["お","あ"]
  ];
  function findConfusableGroup(ch){
    for(var i = 0; i < CONFUSABLE_GROUPS.length; i++){
      if(CONFUSABLE_GROUPS[i].indexOf(ch) !== -1) return CONFUSABLE_GROUPS[i];
    }
    return null;
  }

  var els = {};
  ["btnSound","btnSettings","screen-title","btnStart","btnOpenSettingsFromTitle","catPicker",
   "screen-game","roundLabel","starGame","starTop","reels","trickyBanner","btnLever",
   "promptRow","prompt","btnHearWord",
   "choices","feedback","btnNext","btnBackTitle",
   "screen-settings","settingsCatLabel","nameInput","btnSaveNames","btnResetNames","btnCloseSettings",
   "confettiLayer"].forEach(function(id){ els[id] = document.getElementById(id); });

  var state = {
    category: loadCategory(),
    muted: loadMuted(),
    score: 0,
    round: 0,
    lastTarget: null,
    target: "",
    spinning: false,
    reelTimers: [],
    answered: false,
    landedCount: 0,
    trickyIndex: -1
  };
  state.names = loadWords(state.category);

  updateSoundIcon();
  updateStars();
  renderCategoryPicker();

  function loadCategory(){
    try{
      var c = localStorage.getItem(CATEGORY_KEY);
      if(c && CATEGORIES[c]) return c;
    }catch(e){}
    return "animal";
  }
  function saveCategory(c){
    try{ localStorage.setItem(CATEGORY_KEY, c); }catch(e){}
  }
  function defaultWordsFor(category){
    return CATEGORIES[category].items.map(function(it){ return it.word; });
  }
  function loadWords(category){
    try{
      var raw = localStorage.getItem(WORDS_KEY_PREFIX + category);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length >= 4) return arr;
      }
    }catch(e){}
    return defaultWordsFor(category);
  }
  function saveWords(category, arr){
    try{ localStorage.setItem(WORDS_KEY_PREFIX + category, JSON.stringify(arr)); }catch(e){}
  }
  function iconForWord(category, word){
    var found = CATEGORIES[category].items.filter(function(it){ return it.word === word; })[0];
    if(found) return found;
    return { word: word, icon: CATEGORIES[category].fallbackIcon };
  }
  function loadMuted(){
    try{ return localStorage.getItem(MUTE_KEY) === "1"; }catch(e){ return false; }
  }
  function saveMuted(v){
    try{ localStorage.setItem(MUTE_KEY, v ? "1" : "0"); }catch(e){}
  }

  function renderCategoryPicker(){
    els.catPicker.innerHTML = "";
    Object.keys(CATEGORIES).forEach(function(key){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cat-btn" + (key === state.category ? " active" : "");
      btn.textContent = CATEGORIES[key].chip;
      btn.addEventListener("click", function(){ selectCategory(key); });
      els.catPicker.appendChild(btn);
    });
  }

  function selectCategory(key){
    if(key === state.category) return;
    state.category = key;
    saveCategory(key);
    state.names = loadWords(key);
    state.lastTarget = null;
    renderCategoryPicker();
  }

  function showScreen(name){
    ["screen-title","screen-game","screen-settings"].forEach(function(id){
      els[id].hidden = (id !== name);
    });
  }

  // ---------- audio ----------
  var audioCtx = null;
  function ensureAudio(){
    if(state.muted) return null;
    try{
      if(!audioCtx){
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function beep(freq, dur, delay, type, vol){
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function sndStart(){ beep(440,.12,0,"triangle"); beep(660,.14,.09,"triangle"); }
  function sndTick(){ beep(880,.08,0,"square",.12); }
  function sndCorrect(){ beep(523,.14,0,"sine"); beep(659,.14,.12,"sine"); beep(784,.22,.24,"sine"); }
  function sndWrong(){ beep(220,.18,0,"sawtooth",.12); beep(180,.22,.1,"sawtooth",.1); }
  function sndFlicker(){ beep(700, .05, 0, "square", .07); }

  function speak(text, rate, pitch){
    if(state.muted) return;
    if(!("speechSynthesis" in window)) return;
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP";
      u.rate = rate || 0.9;
      u.pitch = pitch || 1.15;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function stopSpeaking(){
    try{ if("speechSynthesis" in window) window.speechSynthesis.cancel(); }catch(e){}
  }

  function updateSoundIcon(){
    els.btnSound.textContent = state.muted ? "🔇" : "🔊";
  }

  els.btnSound.addEventListener("click", function(){
    state.muted = !state.muted;
    saveMuted(state.muted);
    updateSoundIcon();
    if(state.muted){
      stopSpeaking();
    }else{
      ensureAudio();
    }
  });

  els.btnHearWord.addEventListener("click", function(){
    if(state.target) speak(state.target, 0.9, 1.05);
  });

  // ---------- settings ----------
  function openSettings(){
    els.settingsCatLabel.textContent = CATEGORIES[state.category].label;
    els.nameInput.value = state.names.join("\n");
    showScreen("screen-settings");
  }
  els.btnSettings.addEventListener("click", openSettings);
  els.btnOpenSettingsFromTitle.addEventListener("click", openSettings);
  els.btnCloseSettings.addEventListener("click", function(){
    showScreen(state.round > 0 ? "screen-game" : "screen-title");
  });
  els.btnSaveNames.addEventListener("click", function(){
    var lines = els.nameInput.value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    var uniq = [];
    lines.forEach(function(n){ if(uniq.indexOf(n) === -1) uniq.push(n); });
    if(uniq.length < 4){
      alert("ことばは 4こ いじょう にゅうりょくしてね！");
      return;
    }
    state.names = uniq;
    saveWords(state.category, uniq);
    showScreen(state.round > 0 ? "screen-game" : "screen-title");
  });
  els.btnResetNames.addEventListener("click", function(){
    els.nameInput.value = defaultWordsFor(state.category).join("\n");
  });

  // ---------- title / navigation ----------
  els.btnStart.addEventListener("click", function(){
    ensureAudio();
    state.round = 0;
    state.score = 0;
    updateStars();
    showScreen("screen-game");
    nextRound();
  });
  els.btnBackTitle.addEventListener("click", function(){
    clearReelTimers();
    stopSpeaking();
    showScreen("screen-title");
  });

  // ---------- game flow ----------
  function updateStars(){
    els.starGame.textContent = state.score;
    els.starTop.textContent = state.score;
  }

  function pickTarget(){
    var pool = state.names;
    var pick;
    do{
      pick = pool[Math.floor(Math.random() * pool.length)];
    }while(pool.length > 1 && pick === state.lastTarget);
    state.lastTarget = pick;
    return pick;
  }

  function buildReels(word){
    els.reels.innerHTML = "";
    var reelEls = [];
    for(var i = 0; i < word.length; i++){
      var reel = document.createElement("div");
      reel.className = "reel";
      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = "?";
      reel.appendChild(letter);
      els.reels.appendChild(reel);
      reelEls.push(reel);
    }
    return reelEls;
  }

  function clearReelTimers(){
    state.reelTimers.forEach(function(t){ clearInterval(t); clearTimeout(t); });
    state.reelTimers = [];
  }

  function nextRound(){
    clearReelTimers();
    stopSpeaking();
    state.answered = false;
    state.spinning = false;
    state.round += 1;
    state.target = pickTarget();
    els.roundLabel.textContent = state.round + "もんめ";
    els.prompt.textContent = CATEGORIES[state.category].prompt;
    buildReels(state.target);
    var trickyCandidates = [];
    state.target.split("").forEach(function(ch, idx){
      if(findConfusableGroup(ch)) trickyCandidates.push(idx);
    });
    state.trickyIndex = trickyCandidates.length
      ? trickyCandidates[Math.floor(Math.random() * trickyCandidates.length)]
      : -1;
    els.trickyBanner.hidden = (state.trickyIndex === -1);
    els.promptRow.hidden = true;
    els.choices.hidden = true;
    els.choices.innerHTML = "";
    els.feedback.textContent = "";
    els.feedback.className = "feedback";
    els.btnNext.hidden = true;
    els.btnLever.hidden = false;
    els.btnLever.removeAttribute("disabled");
  }

  els.btnLever.addEventListener("click", function(){
    if(state.spinning) return;
    startSpin();
  });

  function randomLetter(){
    return LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];
  }

  // どのリールも「目で追えるくらい ゆっくり」動くように、文字が切り替わる
  // 間隔をだんだん のばしながら 正解の文字に着地させる(実際のスロットの減速に近い動き)
  function buildFlickerPlan(reelIndex, correctChar, isTricky, group){
    var letters = [];
    var delays = [];
    var preRollCount = reelIndex * 3 + 3;
    for(var k = 0; k < preRollCount; k++){
      letters.push(randomLetter());
      delays.push(170);
    }
    var decelDelays = [190, 240, 300, 380, 470];
    for(var d = 0; d < decelDelays.length - 1; d++){
      letters.push(isTricky ? group[Math.floor(Math.random() * group.length)] : randomLetter());
      delays.push(decelDelays[d]);
    }
    return { letters: letters, delays: delays, finalDelay: decelDelays[decelDelays.length - 1] };
  }

  function startSpin(){
    state.spinning = true;
    state.landedCount = 0;
    els.btnLever.setAttribute("disabled", "disabled");
    ensureAudio();
    stopSpeaking();
    sndStart();

    var reelEls = Array.prototype.slice.call(els.reels.children);
    var word = state.target;
    var total = reelEls.length;

    reelEls.forEach(function(reel, i){
      reel.classList.remove("landed");
      reel.classList.add("spinning");
      var correctChar = word[i];
      var isTricky = (i === state.trickyIndex);
      var group = isTricky ? findConfusableGroup(correctChar) : null;
      if(isTricky){
        reel.classList.add("tricky");
        addHintBadge(reel);
      }
      var plan = buildFlickerPlan(i, correctChar, isTricky, group);
      runFlickerSequence(reel, plan, correctChar, total);
    });
  }

  function runFlickerSequence(reel, plan, correctChar, total){
    var letterEl = reel.querySelector(".letter");
    var idx = 0;
    function step(){
      if(idx < plan.letters.length){
        letterEl.textContent = plan.letters[idx];
        reel.classList.remove("flip");
        void reel.offsetWidth;
        reel.classList.add("flip");
        sndFlicker();
        var d = plan.delays[idx];
        idx++;
        var t = setTimeout(step, d);
        state.reelTimers.push(t);
      }else{
        var t2 = setTimeout(function(){ landReel(reel, correctChar, total); }, plan.finalDelay);
        state.reelTimers.push(t2);
      }
    }
    step();
  }

  function addHintBadge(reel){
    var badge = document.createElement("span");
    badge.className = "hint-badge";
    badge.textContent = "🔍";
    reel.appendChild(badge);
  }
  function removeHintBadge(reel){
    var b = reel.querySelector(".hint-badge");
    if(b) b.remove();
  }

  function landReel(reel, correctChar, total){
    var letterEl = reel.querySelector(".letter");
    letterEl.textContent = correctChar;
    reel.classList.remove("tricky", "flip", "spinning");
    removeHintBadge(reel);
    reel.classList.add("landed");
    sndTick();
    speak(correctChar, 0.85, 1.25);
    state.landedCount += 1;
    if(state.landedCount === total){
      var t = setTimeout(function(){
        state.spinning = false;
        revealChoices();
      }, 500);
      state.reelTimers.push(t);
    }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function createChoiceCard(word){
    var item = iconForWord(state.category, word);
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice-card";

    var inner = document.createElement("div");
    inner.className = "card-inner";

    var front = document.createElement("div");
    front.className = "card-face card-front";
    if(item.swatch){
      var sw = document.createElement("span");
      sw.className = "color-swatch";
      sw.style.background = item.swatch;
      if(item.border) sw.style.boxShadow = "inset 0 0 0 3px " + item.border;
      front.appendChild(sw);
    }else{
      front.textContent = item.icon;
    }

    var back = document.createElement("div");
    back.className = "card-face card-back";
    back.textContent = word;

    inner.appendChild(front);
    inner.appendChild(back);
    btn.appendChild(inner);
    btn.addEventListener("click", function(){ handleChoice(btn, word); });
    return btn;
  }

  function revealChoices(){
    var others = state.names.filter(function(n){ return n !== state.target; });
    var distractors = shuffle(others).slice(0, Math.min(3, others.length));
    var options = shuffle([state.target].concat(distractors));

    els.choices.innerHTML = "";
    options.forEach(function(word){
      els.choices.appendChild(createChoiceCard(word));
    });

    els.promptRow.hidden = false;
    els.choices.hidden = false;
    els.btnLever.hidden = true;

    var t = setTimeout(function(){ speak(state.target, 0.9, 1.05); }, 350);
    state.reelTimers.push(t);
  }

  function handleChoice(btn, word){
    if(state.answered) return;
    btn.classList.add("flipped");
    if(word === state.target){
      state.answered = true;
      btn.classList.add("correct");
      state.score += 1;
      updateStars();
      sndCorrect();
      burstConfetti();
      els.feedback.className = "feedback ok";
      els.feedback.textContent = pickOne(["せいかい！やったね！🎉","すごい！だいせいかい！✨","ぴんぽーん！せいかい！🌟"]);
      Array.prototype.forEach.call(els.choices.children, function(b){
        if(b !== btn) b.classList.add("faded");
      });
      els.btnNext.hidden = false;
    }else{
      btn.classList.add("wrong", "faded");
      sndWrong();
      els.feedback.className = "feedback ng";
      els.feedback.textContent = pickOne(["おしい！もういちど かんがえてみよう","ちがうみたい、ほかの カードは？","にゃんと！もう いっかい トライ！"]);
    }
  }

  function pickOne(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  els.btnNext.addEventListener("click", nextRound);

  function burstConfetti(){
    var emojis = ["⭐","🎉","✨","🌟","🎈"];
    var colors = ["#FF6B81","#3EC6C0","#FFC93C","#9B7EDE","#4FADE8"];
    for(var i = 0; i < 22; i++){
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      piece.style.color = colors[Math.floor(Math.random() * colors.length)];
      var dx = (Math.random() * 240 - 120) + "px";
      var rot = (Math.random() * 480 - 240) + "deg";
      piece.style.setProperty("--dx", dx);
      piece.style.setProperty("--rot", rot);
      piece.style.left = (40 + Math.random() * 20) + "%";
      piece.style.animationDelay = (Math.random() * 0.15) + "s";
      els.confettiLayer.appendChild(piece);
      (function(p){
        setTimeout(function(){ p.remove(); }, 1500);
      })(piece);
    }
  }

  showScreen("screen-title");
})();
</script>
</body>
</html>
