<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だれのなまえ？スロットあてっこゲーム</title>
<meta name="description" content="ことばあそび用の、スロットマシンみたいに文字が回って止まる、なまえあてゲームです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF6E7;
  --panel:#FFFFFF;
  --ink:#4A3826;
  --muted:#8A7860;
  --line:#F0DEBE;
  --focus:#2F7DDB;
  --pink:#FF6B81;
  --pink-dark:#E14D63;
  --teal:#3EC6C0;
  --teal-dark:#1FA39D;
  --yellow:#FFC93C;
  --yellow-dark:#E5A800;
  --purple:#9B7EDE;
  --purple-dark:#7C5BC4;
  --blue:#4FADE8;
  --green:#3EC77A;
  --green-dark:#249B57;
  --red:#F0576B;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 18%, #FFE7A6 0 3%, transparent 3.4%),
    radial-gradient(circle at 85% 12%, #B9E9E7 0 3%, transparent 3.4%),
    radial-gradient(circle at 90% 70%, #FFD0DA 0 2.4%, transparent 2.8%),
    radial-gradient(circle at 8% 78%, #D7CCF6 0 2.6%, transparent 3%),
    var(--bg);
  color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.6;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px;position:relative}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(74,56,38,.12)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.star-badge{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(74,56,38,.12)}

.screen{padding-top:6px}
.logo{font-weight:800;font-size:26px;text-align:center;margin:10px 0 16px;line-height:1.4}
.logo .sub{display:block;font-size:16px;font-weight:700;color:var(--pink-dark);margin-top:2px}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 rgba(74,56,38,.08)}
.howto h2{margin:0 0 8px;font-size:17px}
.howto ol{margin:0;padding-left:1.3em}
.howto li{margin:6px 0;font-size:15px}

.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:60px;margin-top:18px;
  background:linear-gradient(180deg,#FF8A9B,var(--pink));
  color:#fff;font-weight:800;font-size:19px;border-radius:18px;
  box-shadow:0 5px 0 var(--pink-dark);
}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-dark)}
.cta.big{font-size:21px;min-height:66px}
.cta[disabled]{opacity:.5;pointer-events:none}

.ghost-btn{
  width:100%;min-height:48px;margin-top:10px;background:var(--panel);
  border:2px solid var(--line);border-radius:14px;font-weight:700;font-size:15px;color:var(--muted);
}
.link-btn{display:block;width:100%;text-align:center;margin-top:16px;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

.hud{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;font-weight:700}
.hud .round{background:var(--purple);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.hud .score{color:var(--yellow-dark);font-size:16px}

.machine{
  background:linear-gradient(180deg,#5B4636,#3E2F24);
  border-radius:22px;padding:20px 14px 26px;position:relative;
  box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.25);
}
.machine-lights{display:flex;justify-content:space-around;margin-bottom:14px;padding:0 4px}
.machine-lights span{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 6px 2px rgba(255,201,60,.7);animation:blink 1s infinite}
.machine-lights span:nth-child(2n){animation-delay:.3s;background:var(--pink)}
.machine-lights span:nth-child(3n){animation-delay:.6s;background:var(--teal)}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

.reels{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 6px;background:#2A2019;border-radius:16px;box-shadow:inset 0 3px 8px rgba(0,0,0,.5)}
.reel{
  width:clamp(46px,15vw,68px);height:clamp(56px,18vw,80px);
  background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(26px,8vw,38px);font-weight:800;position:relative;overflow:hidden;
  border-bottom:5px solid var(--line);
}
.reel:nth-child(4n+1){border-bottom-color:var(--pink)}
.reel:nth-child(4n+2){border-bottom-color:var(--teal)}
.reel:nth-child(4n+3){border-bottom-color:var(--yellow)}
.reel:nth-child(4n+4){border-bottom-color:var(--purple)}
.reel .letter{display:block;transition:filter .1s}
.reel.spinning .letter{filter:blur(3px);opacity:.75}
.reel.spinning{animation:jiggle .09s linear infinite}
@keyframes jiggle{0%{transform:translateY(0)}50%{transform:translateY(2px)}100%{transform:translateY(0)}}
.reel.landed{animation:pop .38s ease}
@keyframes pop{0%{transform:scale(1.35) rotate(-6deg)}55%{transform:scale(.9) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.reel.tricky{box-shadow:inset 0 0 0 3px var(--yellow-dark),0 0 12px 2px rgba(255,201,60,.65);perspective:200px}
.reel .hint-badge{position:absolute;top:-12px;right:-8px;font-size:16px;animation:badgePulse .6s infinite;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.reel.flip .letter{animation:flipStep .16s ease}
@keyframes flipStep{0%{transform:rotateX(80deg);opacity:.25}100%{transform:rotateX(0deg);opacity:1}}
.tricky-banner{
  text-align:center;font-weight:800;font-size:13.5px;color:var(--purple-dark);
  background:#FDF3D8;border:2px dashed var(--yellow-dark);border-radius:14px;
  padding:8px 10px;margin:0 0 10px;
}

.lever-wrap{display:flex;justify-content:center;margin-top:18px}
.lever-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(180deg,#FFD873,var(--yellow));
  color:#5C3A00;font-weight:800;font-size:18px;padding:14px 30px;border-radius:20px;
  box-shadow:0 5px 0 var(--yellow-dark);min-height:64px;min-width:220px;justify-content:center;
}
.lever-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--yellow-dark)}
.lever-btn[disabled]{opacity:.45;pointer-events:none}

.prompt{text-align:center;font-weight:700;font-size:18px;margin:18px 0 10px;color:var(--purple-dark)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-btn{
  min-height:56px;background:var(--panel);border:3px solid var(--line);border-radius:16px;
  font-weight:800;font-size:19px;box-shadow:0 4px 0 rgba(74,56,38,.1);
}
.choice-btn:active{transform:translateY(3px);box-shadow:none}
.choice-btn.correct{background:var(--green);border-color:var(--green-dark);color:#fff}
.choice-btn.wrong{background:#FFE1E5;border-color:var(--red);color:var(--red);animation:shake .35s}
.choice-btn.faded{opacity:.35;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback{text-align:center;font-weight:800;font-size:19px;min-height:30px;margin-top:14px}
.feedback.ok{color:var(--green-dark)}
.feedback.ng{color:var(--pink-dark)}

.settings h2{font-size:18px;margin:6px 0 4px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
textarea#nameInput{
  width:100%;min-height:220px;padding:12px;border-radius:14px;border:2px solid var(--line);
  font-size:16px;font-family:inherit;resize:vertical;background:var(--panel);color:var(--ink);
}
.row{display:flex;gap:10px;margin-top:10px}
.row .cta{margin-top:0}
.row .ghost-btn{margin-top:0}

.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti-piece{position:absolute;top:38%;left:50%;font-size:22px;animation:confetti-fall 1.1s ease-out forwards}
@keyframes confetti-fall{
  0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(var(--dx),260px) rotate(var(--rot)) scale(.7);opacity:0}
}

@media (max-width:360px){
  .logo{font-size:22px}
  .choices{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <button id="btnSound" class="icon-btn" aria-label="おとの オン・オフ" title="おとの オン・オフ">🔊</button>
    <div class="star-badge">⭐ <span id="starTop">0</span></div>
    <button id="btnSettings" class="icon-btn" aria-label="なまえリストの せってい" title="せってい">⚙️</button>
  </header>

  <section id="screen-title" class="screen">
    <h1 class="logo">🎰 だれの なまえ？<span class="sub">スロットあてっこゲーム</span></h1>
    <div class="panel howto">
      <h2>あそびかた</h2>
      <ol>
        <li>「レバーを ひく」で スロットが まわるよ</li>
        <li>もじが ひとつずつ とまっていくよ</li>
        <li>とまった もじで、だれの なまえか かんがえよう</li>
        <li>こたえだと おもう ボタンを タップ！</li>
      </ol>
    </div>
    <button id="btnStart" class="cta big">🎮 はじめる</button>
    <button id="btnOpenSettingsFromTitle" class="link-btn">👦👧 あそぶ ひとの なまえを へんしゅうする</button>
  </section>

  <section id="screen-game" class="screen" hidden>
    <div class="hud">
      <span class="round" id="roundLabel">1もんめ</span>
      <span class="score">⭐ <span id="starGame">0</span></span>
    </div>

    <p id="trickyBanner" class="tricky-banner" hidden>🔍 にている もじに ちゅうい！さいごまで よくみてね</p>
    <div class="machine">
      <div class="machine-lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="reels" class="reels"></div>
    </div>

    <div class="lever-wrap">
      <button id="btnLever" class="lever-btn">🎰 レバーを ひく！</button>
    </div>

    <p id="prompt" class="prompt" hidden>だれの なまえかな？</p>
    <div id="choices" class="choices" hidden></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <button id="btnNext" class="cta" hidden>▶ つぎの もんだい</button>
    <button id="btnBackTitle" class="link-btn">🏠 タイトルへ もどる</button>
  </section>

  <section id="screen-settings" class="screen" hidden>
    <h2>なまえリストの へんしゅう</h2>
    <p class="hint">1ぎょうに ひとつずつ、ひらがな・カタカナで なまえを にゅうりょくしてね（さいてい 4にん ひつよう）。おともだちや かぞくの なまえに かえて あそべるよ。</p>
    <textarea id="nameInput" spellcheck="false"></textarea>
    <div class="row">
      <button id="btnSaveNames" class="cta">💾 ほぞんする</button>
    </div>
    <button id="btnResetNames" class="ghost-btn">はじめの リストに もどす</button>
    <button id="btnCloseSettings" class="link-btn">◀ もどる</button>
  </section>

</div>

<div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "nameSlotGame.names.v1";
  var MUTE_KEY = "nameSlotGame.muted.v1";
  var DEFAULT_NAMES = ["れん","ゆい","そら","みお","はると","さくら","ひなた","あおい","ゆうと","いつき","めい","こはる","りく","あかり","たいが","のあ"];
  var LETTER_POOL = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ".split("");
  var CONFUSABLE_GROUPS = [
    ["る","ろ"],
    ["わ","ね","れ"],
    ["ぬ","め"],
    ["は","ほ"],
    ["さ","ち"],
    ["し","つ"],
    ["い","り"],
    ["く","へ"],
    ["な","た"],
    ["ま","も"],
    ["ん","そ"],
    ["お","あ"]
  ];
  function findConfusableGroup(ch){
    for(var i = 0; i < CONFUSABLE_GROUPS.length; i++){
      if(CONFUSABLE_GROUPS[i].indexOf(ch) !== -1) return CONFUSABLE_GROUPS[i];
    }
    return null;
  }

  var els = {};
  ["btnSound","btnSettings","screen-title","btnStart","btnOpenSettingsFromTitle",
   "screen-game","roundLabel","starGame","starTop","reels","trickyBanner","btnLever","prompt",
   "choices","feedback","btnNext","btnBackTitle",
   "screen-settings","nameInput","btnSaveNames","btnResetNames","btnCloseSettings",
   "confettiLayer"].forEach(function(id){ els[id] = document.getElementById(id); });

  var state = {
    names: loadNames(),
    muted: loadMuted(),
    score: 0,
    round: 0,
    lastTarget: null,
    target: "",
    spinning: false,
    reelTimers: [],
    answered: false,
    landedCount: 0,
    trickyIndex: -1
  };

  updateSoundIcon();
  updateStars();

  function loadNames(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length >= 4) return arr;
      }
    }catch(e){}
    return DEFAULT_NAMES.slice();
  }
  function saveNames(arr){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){}
  }
  function loadMuted(){
    try{ return localStorage.getItem(MUTE_KEY) === "1"; }catch(e){ return false; }
  }
  function saveMuted(v){
    try{ localStorage.setItem(MUTE_KEY, v ? "1" : "0"); }catch(e){}
  }

  function showScreen(name){
    ["screen-title","screen-game","screen-settings"].forEach(function(id){
      els[id].hidden = (id !== name);
    });
  }

  // ---------- audio ----------
  var audioCtx = null;
  function ensureAudio(){
    if(state.muted) return null;
    try{
      if(!audioCtx){
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }catch(e){ return null; }
  }
  function beep(freq, dur, delay, type, vol){
    var ctx = ensureAudio();
    if(!ctx) return;
    try{
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }catch(e){}
  }
  function sndStart(){ beep(440,.12,0,"triangle"); beep(660,.14,.09,"triangle"); }
  function sndTick(){ beep(880,.08,0,"square",.12); }
  function sndCorrect(){ beep(523,.14,0,"sine"); beep(659,.14,.12,"sine"); beep(784,.22,.24,"sine"); }
  function sndWrong(){ beep(220,.18,0,"sawtooth",.12); beep(180,.22,.1,"sawtooth",.1); }
  function sndSuspense(step){ beep(300 + step * 35, .09, 0, "triangle", .1); }

  function updateSoundIcon(){
    els.btnSound.textContent = state.muted ? "🔇" : "🔊";
  }

  els.btnSound.addEventListener("click", function(){
    state.muted = !state.muted;
    saveMuted(state.muted);
    updateSoundIcon();
    if(!state.muted) ensureAudio();
  });

  // ---------- settings ----------
  function openSettings(){
    els.nameInput.value = state.names.join("\n");
    showScreen("screen-settings");
  }
  els.btnSettings.addEventListener("click", openSettings);
  els.btnOpenSettingsFromTitle.addEventListener("click", openSettings);
  els.btnCloseSettings.addEventListener("click", function(){
    showScreen(state.round > 0 ? "screen-game" : "screen-title");
  });
  els.btnSaveNames.addEventListener("click", function(){
    var lines = els.nameInput.value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
    var uniq = [];
    lines.forEach(function(n){ if(uniq.indexOf(n) === -1) uniq.push(n); });
    if(uniq.length < 4){
      els.feedback.textContent = "";
      alert("なまえは 4にん いじょう にゅうりょくしてね！");
      return;
    }
    state.names = uniq;
    saveNames(uniq);
    showScreen(state.round > 0 ? "screen-game" : "screen-title");
  });
  els.btnResetNames.addEventListener("click", function(){
    els.nameInput.value = DEFAULT_NAMES.join("\n");
  });

  // ---------- title / navigation ----------
  els.btnStart.addEventListener("click", function(){
    ensureAudio();
    state.round = 0;
    state.score = 0;
    updateStars();
    showScreen("screen-game");
    nextRound();
  });
  els.btnBackTitle.addEventListener("click", function(){
    clearReelTimers();
    showScreen("screen-title");
  });

  // ---------- game flow ----------
  function updateStars(){
    els.starGame.textContent = state.score;
    els.starTop.textContent = state.score;
  }

  function pickTarget(){
    var pool = state.names;
    var pick;
    do{
      pick = pool[Math.floor(Math.random() * pool.length)];
    }while(pool.length > 1 && pick === state.lastTarget);
    state.lastTarget = pick;
    return pick;
  }

  function buildReels(word){
    els.reels.innerHTML = "";
    var reelEls = [];
    for(var i = 0; i < word.length; i++){
      var reel = document.createElement("div");
      reel.className = "reel";
      var letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = "?";
      reel.appendChild(letter);
      els.reels.appendChild(reel);
      reelEls.push(reel);
    }
    return reelEls;
  }

  function clearReelTimers(){
    state.reelTimers.forEach(function(t){ clearInterval(t); clearTimeout(t); });
    state.reelTimers = [];
  }

  function nextRound(){
    clearReelTimers();
    state.answered = false;
    state.spinning = false;
    state.round += 1;
    state.target = pickTarget();
    els.roundLabel.textContent = state.round + "もんめ";
    buildReels(state.target);
    var trickyCandidates = [];
    state.target.split("").forEach(function(ch, idx){
      if(findConfusableGroup(ch)) trickyCandidates.push(idx);
    });
    state.trickyIndex = trickyCandidates.length
      ? trickyCandidates[Math.floor(Math.random() * trickyCandidates.length)]
      : -1;
    els.trickyBanner.hidden = (state.trickyIndex === -1);
    els.prompt.hidden = true;
    els.choices.hidden = true;
    els.choices.innerHTML = "";
    els.feedback.textContent = "";
    els.feedback.className = "feedback";
    els.btnNext.hidden = true;
    els.btnLever.hidden = false;
    els.btnLever.removeAttribute("disabled");
  }

  els.btnLever.addEventListener("click", function(){
    if(state.spinning) return;
    startSpin();
  });

  function startSpin(){
    state.spinning = true;
    state.landedCount = 0;
    els.btnLever.setAttribute("disabled", "disabled");
    ensureAudio();
    sndStart();

    var reelEls = Array.prototype.slice.call(els.reels.children);
    var word = state.target;

    reelEls.forEach(function(reel){
      reel.classList.add("spinning");
      reel.classList.remove("landed");
      var letterEl = reel.querySelector(".letter");
      var interval = setInterval(function(){
        letterEl.textContent = LETTER_POOL[Math.floor(Math.random() * LETTER_POOL.length)];
      }, 55);
      state.reelTimers.push(interval);
      reel._spinInterval = interval;
    });

    reelEls.forEach(function(reel, i){
      var stopAt = 700 + i * 480;
      var correctChar = word[i];
      var group = (i === state.trickyIndex) ? findConfusableGroup(correctChar) : null;
      var timeout = setTimeout(function(){
        clearInterval(reel._spinInterval);
        reel.classList.remove("spinning");
        if(group){
          runTrickyFinish(reel, group, correctChar, reelEls.length);
        }else{
          landReel(reel, correctChar, reelEls.length);
        }
      }, stopAt);
      state.reelTimers.push(timeout);
    });
  }

  function addHintBadge(reel){
    var badge = document.createElement("span");
    badge.className = "hint-badge";
    badge.textContent = "🔍";
    reel.appendChild(badge);
  }
  function removeHintBadge(reel){
    var b = reel.querySelector(".hint-badge");
    if(b) b.remove();
  }

  function landReel(reel, correctChar, total){
    var letterEl = reel.querySelector(".letter");
    letterEl.textContent = correctChar;
    reel.classList.remove("tricky", "flip");
    removeHintBadge(reel);
    reel.classList.add("landed");
    sndTick();
    state.landedCount += 1;
    if(state.landedCount === total){
      var t = setTimeout(function(){
        state.spinning = false;
        revealChoices();
      }, 420);
      state.reelTimers.push(t);
    }
  }

  // 「る/ろ」のような形の似た文字は、最後の瞬間までゆっくり交互に見せて
  // 「最後までしっかり見て選ぶ」注意力を育てる演出にする
  function runTrickyFinish(reel, group, correctChar, total){
    reel.classList.add("tricky");
    addHintBadge(reel);
    var letterEl = reel.querySelector(".letter");
    var steps = [];
    for(var k = 0; k < 4; k++){
      steps.push(group[Math.floor(Math.random() * group.length)]);
    }
    steps.push(correctChar);
    var delays = [80, 130, 190, 270, 380];
    var idx = 0;
    function step(){
      if(idx < steps.length){
        letterEl.textContent = steps[idx];
        reel.classList.remove("flip");
        void reel.offsetWidth;
        reel.classList.add("flip");
        sndSuspense(idx);
        var d = delays[Math.min(idx, delays.length - 1)];
        idx++;
        var t = setTimeout(step, d);
        state.reelTimers.push(t);
      }else{
        landReel(reel, correctChar, total);
      }
    }
    step();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function revealChoices(){
    var others = state.names.filter(function(n){ return n !== state.target; });
    var distractors = shuffle(others).slice(0, Math.min(3, others.length));
    var options = shuffle([state.target].concat(distractors));

    els.choices.innerHTML = "";
    options.forEach(function(name){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = name;
      btn.addEventListener("click", function(){ handleChoice(btn, name); });
      els.choices.appendChild(btn);
    });

    els.prompt.hidden = false;
    els.choices.hidden = false;
    els.btnLever.hidden = true;
  }

  function handleChoice(btn, name){
    if(state.answered) return;
    if(name === state.target){
      state.answered = true;
      btn.classList.add("correct");
      state.score += 1;
      updateStars();
      sndCorrect();
      burstConfetti();
      els.feedback.className = "feedback ok";
      els.feedback.textContent = pickOne(["せいかい！やったね！🎉","すごい！だいせいかい！✨","ぴんぽーん！せいかい！🌟"]);
      Array.prototype.forEach.call(els.choices.children, function(b){
        if(b !== btn) b.classList.add("faded");
      });
      els.btnNext.hidden = false;
    }else{
      btn.classList.add("wrong");
      btn.classList.add("faded");
      sndWrong();
      els.feedback.className = "feedback ng";
      els.feedback.textContent = pickOne(["おしい！もういちど かんがえてみよう","ちがうみたい、ほかの こたえは？","にゃんと！もう いっかい トライ！"]);
      setTimeout(function(){ btn.classList.remove("wrong"); }, 400);
    }
  }

  function pickOne(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  els.btnNext.addEventListener("click", nextRound);

  function burstConfetti(){
    var emojis = ["⭐","🎉","✨","🌟","🎈"];
    var colors = ["#FF6B81","#3EC6C0","#FFC93C","#9B7EDE","#4FADE8"];
    for(var i = 0; i < 22; i++){
      var piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      piece.style.color = colors[Math.floor(Math.random() * colors.length)];
      var dx = (Math.random() * 240 - 120) + "px";
      var rot = (Math.random() * 480 - 240) + "deg";
      piece.style.setProperty("--dx", dx);
      piece.style.setProperty("--rot", rot);
      piece.style.left = (40 + Math.random() * 20) + "%";
      piece.style.animationDelay = (Math.random() * 0.15) + "s";
      els.confettiLayer.appendChild(piece);
      (function(p){
        setTimeout(function(){ p.remove(); }, 1500);
      })(piece);
    }
  }

  showScreen("screen-title");
})();
</script>
</body>
