<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>あと一歩でやめる人、続けて金脈にたどりつく人</title>
<link rel="stylesheet" href="fonts/klee.css">
<style>
  :root{ --paper:#F3EAD7; --ink:#3B342C; --terra:#C4694D; --sage:#5E8C7F; --ochre:#D9A93F; --soft:#7A6F61; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);
    font-family:'Klee One','IPAGothic','Noto Sans CJK JP',sans-serif;color:var(--ink)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:
    radial-gradient(ellipse at 50% 40%, rgba(255,250,235,.9) 0, rgba(255,250,235,0) 70%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(120,90,50,.18) 100%), var(--paper)}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:20;mix-blend-mode:multiply;opacity:.55;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .40  0 0 0 0 .32  0 0 0 0 .22  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .rough{filter:url(#rough)}

  /* caption zone (fixed area, never overlaps the scene) */
  #cap{position:absolute;left:70px;right:70px;top:230px;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .5s;z-index:7}
  #cap .main{font-size:72px;line-height:1.5;font-weight:600;white-space:pre-line}
  #cap .sub{margin-top:26px;font-size:34px;line-height:1.65;color:var(--soft);font-weight:400;white-space:pre-line}
  mark{background:none;position:relative;color:inherit;display:inline-block;z-index:0}
  mark::before{content:"";position:absolute;left:-8px;right:-8px;bottom:6px;height:.46em;z-index:-1;border-radius:6px 16px 8px 14px;transform:rotate(-1.2deg);background:rgba(232,190,90,.62)}
  mark.c::before{background:rgba(212,120,96,.5);transform:rotate(.9deg)}

  /* scene */
  #scene{position:absolute;left:0;top:0;width:1080px;height:1920px;transition:opacity .9s;z-index:3}
  .col{position:absolute;top:940px;width:440px;height:800px}
  .box{position:absolute;inset:0;border:5px solid var(--ink);border-radius:26px 34px 22px 38px;overflow:hidden;
    background:
      repeating-linear-gradient(112deg,rgba(60,45,30,.10) 0 2px,transparent 2px 15px),
      linear-gradient(#9DB77A 0 36px,#D8BF98 36px 250px,#C9A877 250px 470px,#B08A57 470px 650px,#86663F 650px 100%)}
  .shaft{position:absolute;left:165px;top:36px;width:110px;height:0;background:#2E2A33;border-left:4px solid var(--ink);border-right:4px solid var(--ink)}
  .gold{position:absolute;left:100px;top:640px;width:240px;height:120px;opacity:0}
  .miner{position:absolute;width:80px;height:136px;overflow:visible;z-index:3}
  .pick{transform-box:fill-box;transform-origin:10% 90%}
  .miner .w,.miner .h,.miner .sd,.miner .sweat{opacity:0}
  .miner.worry .w{opacity:1}.miner.worry .n{opacity:0}.miner.worry .sweat{opacity:1}
  .miner.happy .h{opacity:1}.miner.happy .n{opacity:0}
  .miner.sad .sd{opacity:1}.miner.sad .n{opacity:0}
  .bubble{position:absolute;z-index:5;padding:8px 26px;border:4px solid var(--ink);background:#FBF5E6;border-radius:30px 38px 34px 26px;font-size:38px;font-weight:600;white-space:nowrap;opacity:0;transform:rotate(-2deg)}
  .tag{position:absolute;z-index:5;padding:6px 20px;background:rgba(246,226,170,.95);border:3px solid rgba(60,45,30,.55);font-size:32px;font-weight:600;white-space:nowrap;opacity:0;transform:rotate(-2.5deg)}
  .conf{position:absolute;width:16px;height:22px;z-index:6;border-radius:3px}

  /* masking-tape labels under the columns */
  .tape{position:absolute;top:1765px;width:340px;height:92px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:38px;font-weight:600;
    background:rgba(238,216,150,.9);clip-path:polygon(2% 8%,6% 0,12% 8%,18% 0,94% 4%,100% 0,98% 50%,100% 96%,92% 100%,86% 92%,10% 100%,4% 92%,0 96%,2% 48%);opacity:0;z-index:4}
  .tape b{font-weight:600;font-size:46px;font-variant-numeric:tabular-nums}
  #tpA{left:120px;transform:rotate(-2deg)} #tpB{left:620px;transform:rotate(1.6deg)}
  #tpA b{color:var(--terra)} #tpB b{color:var(--sage)}

  /* notebook */
  #note{position:absolute;left:120px;right:120px;top:880px;height:820px;transform:rotate(-1.2deg);background:
    linear-gradient(90deg,transparent 0 78px,rgba(196,105,77,.55) 78px 81px,transparent 81px),
    repeating-linear-gradient(#FBF6EA 0 74px,#CFE0E4 74px 77px);
    border:4px solid rgba(60,45,30,.7);border-radius:6px 16px 8px 14px;box-shadow:6px 10px 0 rgba(60,45,30,.18);padding:30px 40px 30px 110px;opacity:0;z-index:6}
  #note h3{font-size:54px;font-weight:600;line-height:77px}
  #note .row{font-size:42px;line-height:77px;opacity:0;white-space:nowrap}
  #note .row b{color:var(--sage);font-weight:600}
  #foot{position:absolute;left:0;right:0;top:1868px;text-align:center;font-size:27px;color:var(--soft);z-index:7}

  #end{position:absolute;inset:0;z-index:9;background:rgba(243,234,215,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;opacity:0;transition:opacity .7s;text-align:center;padding:0 70px}
  #end .big{font-size:80px;line-height:1.55;font-weight:600}
  #end .small{font-size:44px;color:var(--soft)}
  #end .tg{margin-top:26px;font-size:46px;font-weight:600;border-bottom:5px solid var(--ink);padding:0 14px 6px}
</style>
</head>
<body>
<!-- hand-drawn wobble -->
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="rough" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>

<div id="stage">
  <div id="cap"><div class="main" id="capMain"></div><div class="sub" id="capSub"></div></div>

  <div id="scene">
    <!-- A -->
    <div class="col" id="colA" style="left:70px">
      <div class="box rough"><div class="shaft" id="shA"></div>
        <svg class="gold" id="goldA" viewBox="0 0 240 120"><g stroke="#3B342C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><polygon points="22,112 62,46 108,76 130,18 178,66 218,112" fill="#E6B84C" transform="translate(3,2)"/><polygon points="22,112 62,46 108,76 130,18 178,66 218,112" fill="none"/><path d="M62 112 L100 72 L140 112" fill="#F2D77E" stroke-width="3"/></g><path d="M126 32 L134 26 M150 54 L158 48" stroke="#FFFBEA" stroke-width="5" stroke-linecap="round"/></svg>
      </div>
      <svg class="miner rough" id="mA" viewBox="0 0 100 170">
        <g class="pick" id="pkA"><line x1="76" y1="94" x2="104" y2="52" stroke="#7A5A36" stroke-width="7" stroke-linecap="round"/><path d="M92 44 Q110 40 122 56" stroke="#3B342C" stroke-width="7" fill="none" stroke-linecap="round"/></g>
        <path d="M30 70 Q24 100 30 126 L72 126 Q76 98 70 70 Z" fill="#D58B73" transform="translate(3,2)"/>
        <g fill="none" stroke="#3B342C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 70 Q24 100 30 126 L72 126 Q76 98 70 70 Z"/><path d="M40 126 L38 158 M62 126 L64 158"/></g>
        <circle cx="52" cy="44" r="25" fill="#F2D2B0" transform="translate(3,2)"/><circle cx="50" cy="42" r="25" fill="none" stroke="#3B342C" stroke-width="3.5"/>
        <path d="M24 36 Q50 2 76 36 Q50 30 24 36Z" fill="#E1B454" stroke="#3B342C" stroke-width="3.5" stroke-linejoin="round"/>
        <g class="n"><circle cx="41" cy="46" r="3.5" fill="#3B342C"/><circle cx="59" cy="46" r="3.5" fill="#3B342C"/><path d="M43 58 Q50 62 57 58" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="w"><circle cx="41" cy="48" r="3.5" fill="#3B342C"/><circle cx="59" cy="48" r="3.5" fill="#3B342C"/><path d="M33 44 L46 38 M67 44 L54 38" stroke="#3B342C" stroke-width="3" stroke-linecap="round"/><path d="M43 62 Q50 55 57 62" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="sd"><path d="M35 47 Q41 52 47 47 M53 47 Q59 52 65 47" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M43 64 Q50 57 57 64" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <path class="sweat" d="M72 26 q6 10 0 16 q-6 -6 0 -16z" fill="#BBDDEB" stroke="#3B342C" stroke-width="2.5"/>
      </svg>
      <div class="bubble" id="bbA" style="left:215px;top:-150px">もう無理だ…</div>
      <div class="tag" id="tgA" style="left:92px;top:560px">あと一歩…だったかも？</div>
    </div>

    <!-- B -->
    <div class="col" id="colB" style="left:570px">
      <div class="box rough"><div class="shaft" id="shB"></div>
        <svg class="gold" id="goldB" viewBox="0 0 240 120"><g stroke="#3B342C" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><polygon points="22,112 62,46 108,76 130,18 178,66 218,112" fill="#E6B84C" transform="translate(3,2)"/><polygon points="22,112 62,46 108,76 130,18 178,66 218,112" fill="none"/><path d="M62 112 L100 72 L140 112" fill="#F2D77E" stroke-width="3"/></g><path d="M126 32 L134 26 M150 54 L158 48" stroke="#FFFBEA" stroke-width="5" stroke-linecap="round"/></svg>
      </div>
      <svg class="miner rough" id="mB" viewBox="0 0 100 170">
        <g class="pick" id="pkB"><line x1="76" y1="94" x2="104" y2="52" stroke="#7A5A36" stroke-width="7" stroke-linecap="round"/><path d="M92 44 Q110 40 122 56" stroke="#3B342C" stroke-width="7" fill="none" stroke-linecap="round"/></g>
        <path d="M30 70 Q24 100 30 126 L72 126 Q76 98 70 70 Z" fill="#7FA89B" transform="translate(3,2)"/>
        <g fill="none" stroke="#3B342C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M30 70 Q24 100 30 126 L72 126 Q76 98 70 70 Z"/><path d="M40 126 L38 158 M62 126 L64 158"/></g>
        <circle cx="52" cy="44" r="25" fill="#F2D2B0" transform="translate(3,2)"/><circle cx="50" cy="42" r="25" fill="none" stroke="#3B342C" stroke-width="3.5"/>
        <path d="M24 36 Q50 2 76 36 Q50 30 24 36Z" fill="#E1B454" stroke="#3B342C" stroke-width="3.5" stroke-linejoin="round"/>
        <g class="n"><circle cx="41" cy="46" r="3.5" fill="#3B342C"/><circle cx="59" cy="46" r="3.5" fill="#3B342C"/><path d="M43 58 Q50 62 57 58" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="w"><circle cx="41" cy="48" r="3.5" fill="#3B342C"/><circle cx="59" cy="48" r="3.5" fill="#3B342C"/><path d="M33 44 L46 38 M67 44 L54 38" stroke="#3B342C" stroke-width="3" stroke-linecap="round"/><path d="M43 62 Q50 55 57 62" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="h"><path d="M33 47 Q41 39 49 47 M51 47 Q59 39 67 47" stroke="#3B342C" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M41 57 Q50 71 59 57 Z" fill="#FBF5E6" stroke="#3B342C" stroke-width="3" stroke-linejoin="round"/></g>
        <path class="sweat" d="M72 26 q6 10 0 16 q-6 -6 0 -16z" fill="#BBDDEB" stroke="#3B342C" stroke-width="2.5"/>
      </svg>
    </div>

    <div class="tape" id="tpA">Aさん <b id="dA">0</b>m</div>
    <div class="tape" id="tpB">Bさん <b id="dB">0</b>m</div>
  </div>

  <div id="note">
    <h3>前進ノート</h3>
    <div class="row" id="r1">今日の前進：<b>1行、投稿を出した</b></div>
    <div class="row" id="r2">今日の前進：<b>ミュートを1つした</b></div>
    <div class="row" id="r3">今日の前進：<b>書き出しを1つ変えた</b></div>
    <div class="row" id="r4">1週間後に、読み返して決める。</div>
  </div>

  <div id="foot">※ たとえ話です。数字は、イメージです</div>

  <div id="end">
    <div class="small">やめるのも、続けるのも、自由。</div>
    <div class="big">ただし、決めるのは、<br><mark>疲れた夜</mark>ではなく、<br><mark class="c">記録を見た朝</mark>に。</div>
    <div class="tg">@ai_7days_lab</div>
  </div>
  <div class="grain"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const ease = {in:t=>t*t, out:t=>1-(1-t)*(1-t), io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tween(ms, fn){
  return new Promise(res => {
    const t0 = performance.now();
    (function f(now){
      const t = Math.min(1, (now - t0) / ms);
      fn(t);
      t < 1 ? requestAnimationFrame(f) : res();
    })(t0);
  });
}
async function setCap(main, sub='', hold=0){
  const cap = $('#cap'); cap.style.opacity = 0; await sleep(500);
  $('#capMain').innerHTML = main; $('#capSub').innerHTML = sub; cap.style.opacity = 1;
  if(hold) await sleep(hold);
}

const S = { A:{h:0, dig:false, top:null, left:180}, B:{h:0, dig:false, top:null, left:180} };
const SHAFT_TOP = 36, MINER_H = 136;
function minerTop(h){ return SHAFT_TOP + h - MINER_H + 8; }
function setH(id, h){
  S[id].h = h;
  $('#sh'+id).style.height = h + 'px';
  if(S[id].top === null){ $('#m'+id).style.top = minerTop(h) + 'px'; }
  $('#d'+id).textContent = Math.round(h * 0.23);
}
function placeMiner(id, x, y){ S[id].left = x; S[id].top = y; const m = $('#m'+id); m.style.left = x + 'px'; m.style.top = y + 'px'; }
function face(id, cls){ $('#m'+id).setAttribute('class', 'miner rough ' + cls); }

(async function swing(){
  const t0 = performance.now();
  while(true){
    const t = performance.now() - t0;
    for(const id of ['A','B']){
      $('#pk'+id).style.transform = S[id].dig ? `rotate(${-50 + 70 * Math.abs(Math.sin(t/170))}deg)` : 'rotate(20deg)';
    }
    await new Promise(r => requestAnimationFrame(r));
  }
})();

async function digTo(id, h1, ms){
  const h0 = S[id].h; S[id].dig = true;
  await tween(ms, t => setH(id, h0 + (h1 - h0) * t));
  S[id].dig = false;
}

function confetti(colId, x, y){
  const colors = ['#C4694D','#E1B454','#5E8C7F','#3B342C','#FBF5E6'];
  for(let i=0;i<34;i++){
    const d = document.createElement('div'); d.className='conf';
    d.style.background = colors[i % colors.length];
    d.style.left = x + 'px'; d.style.top = y + 'px';
    $(colId).appendChild(d);
    const dx = (Math.random() - .5) * 700, dy = -240 - Math.random() * 420, r = Math.random() * 720;
    d.animate([
      {transform:'translate(0,0) rotate(0)', opacity:1},
      {transform:`translate(${dx*.6}px,${dy}px) rotate(${r*.6}deg)`, opacity:1, offset:.4},
      {transform:`translate(${dx}px,${dy + 760}px) rotate(${r}deg)`, opacity:0}
    ], {duration: 1800 + Math.random()*700, easing:'cubic-bezier(.2,.6,.4,1)', fill:'forwards'});
  }
}

async function main(){
  window.__done = false;
  placeMiner('A', 180, 0); placeMiner('B', 180, 0);
  S.A.top = null; S.B.top = null;
  setH('A', 60); setH('B', 60);
  $('#mA').style.left = '180px'; $('#mB').style.left = '180px';

  await sleep(300);
  $('#tpA').animate([{opacity:0},{opacity:1}], {duration:600, fill:'forwards'});
  $('#tpB').animate([{opacity:0},{opacity:1}], {duration:600, fill:'forwards'});

  // 0s
  const cp = setCap('トンネルを掘る、<br>2人がいました。', '', 0);
  const dA = digTo('A', 270, 4600), dB = digTo('B', 270, 4600);
  await Promise.all([cp, dA, dB]);
  await sleep(200);

  // 5s : nothing comes out
  const c2 = setCap('掘っても、掘っても、<br>何も<mark class="c">出てこない</mark>。', '（反応が少ない日々、のたとえ）', 0);
  const a2 = digTo('A', 560, 6500), b2 = digTo('B', 560, 6500);
  await sleep(2200); face('A','worry'); face('B','worry');
  await Promise.all([c2, a2, b2]);

  // 12.5s : A quits
  face('A','sad');
  $('#bbA').animate([{opacity:0},{opacity:1}], {duration:500, fill:'forwards'});
  const c3 = setCap('Aさんは、<br>ここで<mark class="c">やめました</mark>。', '', 0);
  await sleep(900);
  S.A.dig = false;
  const y0 = minerTop(560), yEnd = -MINER_H + 12;
  await tween(2400, t => placeMiner('A', 180 - 70 * ease.io(t), y0 + (yEnd - y0) * ease.io(t)));
  await c3;
  await sleep(1000);

  // 17s : B keeps going
  const c4 = setCap('Bさんは、<br><mark>もう少しだけ</mark>、<br>掘り続けました。', '', 0);
  const b3 = digTo('B', 620, 5600);
  await c4; await b3;

  // 24s : gold
  face('B','happy');
  $('#goldB').animate([{opacity:0,transform:'scale(.7)'},{opacity:1,transform:'scale(1.12)'},{opacity:1,transform:'scale(1)'}], {duration:700, fill:'forwards'});
  confetti('#colB', 220, 640);
  await setCap('…カキーン！<br><mark>金脈</mark>でした。', '', 3800);

  // 29s : A maybe
  $('#goldA').animate([{opacity:0},{opacity:.55}], {duration:800, fill:'forwards'});
  $('#tgA').animate([{opacity:0},{opacity:1}], {duration:600, delay:500, fill:'forwards'});
  await setCap('Aさんの足もとにも、<br>あったのかもしれない。', '', 4200);

  // 33s : honesty
  await setCap('でも、「あと少し」かどうかは、<br>掘る前には<mark class="c">分かりません</mark>。',
    '「あと一歩でやめた人」の話は、\n結果を知っている人が語る話です。\n（続ければ必ず金脈がある、という意味ではありません）', 7200);

  // 41s : records
  $('#scene').style.opacity = 0.08;
  $('#note').animate([{opacity:0},{opacity:1}], {duration:600, fill:'forwards'});
  await setCap('感覚ではなく、<br><mark>記録</mark>で決める。', '', 0);
  for(const id of ['#r1','#r2','#r3','#r4']){
    $(id).animate([{opacity:0,transform:'translateX(-24px)'},{opacity:1,transform:'translateX(0)'}], {duration:500, fill:'forwards'});
    await sleep(1000);
  }
  await sleep(1200);

  $('#end').style.opacity = 1;
  await sleep(4800);
  window.__done = true;
}
window.addEventListener('load', () => document.fonts.ready.then(() => setTimeout(main, 400)));
</script>
</body>
</html>
